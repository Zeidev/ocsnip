name: Oracle ARM Sniper

# ─────────────────────────────────────────────────────────────
# Genel depoda çalışır: Actions dakikaları sayılmaz, 7×24 kesintisiz
# Her 5 saatte bir tetiklenir, tek çalıştırma en fazla 290 dakika (GitHub job sınırı 6s)
# Önceki tur bitmeden yeni tur kuyruğa alınır, birbirine karışmaz
#
# Yakalamak sadece makineyi açmak değil — cloud-init tek seferde
# "keepalive + prob + ortam" kurulumunu yapar, makine doğuştan tamamlanmış gelir:
# resmî 7 gün boşta kalma kuralı böylece atlanır.
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Sadece push kanalını test et, makine yakalama (1 = test, 0 = normal)'
        required: false
        default: '0'
      shape_config:
        description: 'Shape ayarı JSON'
        required: false
        default: '{"ocpus":2,"memoryInGBs":12}'
      boot_volume_gb:
        description: 'Boot volume GB (Always Free toplam blok depolama 200GB)'
        required: false
        default: '100'
      duration_min:
        description: 'Tek çalıştırma üst sınırı (dakika)'
        required: false
        default: '290'
  # ⏸ Zamanlanmış tetikleme duraklatıldı (2026-10-17): TENANCY_OCID / USER_OCID / SUBNET_ID
  #    Secret'ları eksik; 5 saatte bir boşa dönmek sadece kırmızı işaret üretir.
  #    Tamamladıktan sonra aşağıdaki iki satırın yorumunu kaldırarak geri al:
  # schedule:
  #   - cron: '0 */5 * * *'

concurrency:
  group: oci-arm-sniper
  cancel-in-progress: false

jobs:
  sniper:
    name: ARM Instance Sniper
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OCI_TENANCY: ${{ secrets.TENANCY_OCID }}
      OCI_USER: ${{ secrets.USER_OCID }}
      OCI_FP: ${{ secrets.FINGERPRINT }}
      OCI_REGION: ${{ secrets.REGION }}
      OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      SUBNET_ID: ${{ secrets.SUBNET_ID }}
      SSH_PUB_KEY: ${{ secrets.SSH_PUB_KEY }}
      # ── Push kanalları: hepsi opsiyonel, hangisi tanımlıysa o çalışır ──
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}   # Server酱 (ücretsiz plan: 5/gün)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # Telegram Bot (ücretsiz, sınırsız)
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}             # WeCom grup botu (ücretsiz, sınırsız)
      WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}               # WxPusher (ücretsiz, sınırsız, WeChat'e gider)

    steps:
      - name: Preflight - Secret kontrolü
        run: |
          set -u
          missing=""
          for v in OCI_TENANCY OCI_USER OCI_FP OCI_REGION OCI_PRIVATE_KEY SUBNET_ID SSH_PUB_KEY; do
            eval "val=\${$v:-}"
            [ -z "$val" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Eksik Secret'lar:$missing"
            echo "### ❌ Eksik Secret'lar:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Secret'lar tam" >> "$GITHUB_STEP_SUMMARY"
          [ -z "${SERVERCHAN_SENDKEY:-}" ] && echo "⚠️ SERVERCHAN_SENDKEY tanımlı değil, yakalansa bile WeChat push gitmeyecek" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Push kanalı testi
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notify == '1' }}
        run: |
          set -u
          ok=0
          if [ -n "${SERVERCHAN_SENDKEY:-}" ]; then
            curl -s -m 20 -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
              --data-urlencode "title=✅ OCI sniper · Server酱 kanalı çalışıyor" \
              --data-urlencode "desp=Bu bir kanal test mesajıdır." && ok=1
          fi
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -s -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=✅ OCI sniper · Telegram kanalı çalışıyor" && ok=1
          fi
          if [ -n "${WECOM_WEBHOOK:-}" ]; then
            jq -n '{msgtype:"text",text:{content:"✅ OCI sniper · WeCom kanalı çalışıyor"}}' \
              | curl -s -m 20 -X POST "$WECOM_WEBHOOK" -H 'Content-Type: application/json' -d @- && ok=1
          fi
          if [ -n "${WXPUSHER_SPT:-}" ]; then
            curl -s -m 20 -X POST "https://wxpusher.zjiecode.com/api/send/message/simple-push" \
              -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg s "$WXPUSHER_SPT" '{spt:$s,summary:"OCI sniper kanal testi",content:"✅ OCI sniper · WxPusher kanalı çalışıyor",contentType:1}')" && ok=1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "::error::Hiçbir push kanalı tanımlı değil, en az birini kur (önerilen: WECOM_WEBHOOK veya WXPUSHER_SPT — ücretsiz ve sınırsız)"
            exit 1
          fi
          echo "Test mesajı gönderildi, telefonunu kontrol et." >> "$GITHUB_STEP_SUMMARY"

      - name: OCI CLI kurulumu
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify == '1') }}
        run: |
          curl -sL -o install.sh https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          chmod +x install.sh
          ./install.sh --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null

      - name: OCI config yaz ve kimlik doğrula
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify == '1') }}
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FP}
          tenancy=${OCI_TENANCY}
          region=${OCI_REGION}
          key_file=/home/runner/.oci/key.pem
          EOF
          printf '%s\n' "${OCI_PRIVATE_KEY}" > ~/.oci/key.pem
          chmod 700 ~/.oci
          chmod 600 ~/.oci/key.pem ~/.oci/config
          ~/bin/oci iam region list --query 'data[0].name' --raw-output && echo "✅ OCI kimlik doğrulama başarılı"

      - name: cloud-init indir (makine doğuştan tamamlanmış)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify == '1') }}
        run: |
          mkdir -p ~/.ssh
          curl -sL -o ~/.ssh/cloud-init.yaml \
            https://raw.githubusercontent.com/chengchengbeigu-source/ocisniper/main/.github/cloud-init.yaml
          head -1 ~/.ssh/cloud-init.yaml | grep -q '^#cloud-config' \
            || { echo "::error::cloud-init indirilemedi"; exit 1; }
          printf '%s\n' "${SSH_PUB_KEY}" > ~/.ssh/oracle_arm.pub
          chmod 600 ~/.ssh/oracle_arm.pub ~/.ssh/cloud-init.yaml
          echo "cloud-init hazır, $(wc -l < ~/.ssh/cloud-init.yaml) satır"

      - name: Ana yakalama döngüsü
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify == '1') }}
        env:
          SHAPE_CONFIG: ${{ inputs.shape_config || '{"ocpus":2,"memoryInGBs":12}' }}
          BOOT_GB: ${{ inputs.boot_volume_gb || '100' }}
          DURATION_MIN: ${{ inputs.duration_min || '290' }}
        run: |
          set -u
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          export PATH="$HOME/bin:$PATH"

          notify() {
            local title="$1" body="$2"
            # Kanal 1: Server酱 → kişisel WeChat (ücretsiz plan: 5/gün)
            if [ -n "${SERVERCHAN_SENDKEY:-}" ]; then
              curl -s -m 20 -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
                --data-urlencode "title=$title" --data-urlencode "desp=$body" >/dev/null || true
            fi
            # Kanal 2: Telegram Bot (ücretsiz, sınırsız)
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              TG_TEXT=$(printf '%s\n%s' "$title" "$body")
              curl -s -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${TG_TEXT}" >/dev/null || true
            fi
            # Kanal 3: WeCom grup botu (ücretsiz, sınırsız)
            if [ -n "${WECOM_WEBHOOK:-}" ]; then
              jq -n --arg t "$title" --arg b "$body" \
                '{msgtype:"text",text:{content:($t+"\n"+$b)}}' \
                | curl -s -m 20 -X POST "$WECOM_WEBHOOK" \
                    -H 'Content-Type: application/json' -d @- >/dev/null || true
            fi
            # Kanal 4: WxPusher SPT (ücretsiz, sınırsız, WeChat ClawBot ile direkt)
            if [ -n "${WXPUSHER_SPT:-}" ]; then
              curl -s -m 20 -X POST "https://wxpusher.zjiecode.com/api/send/message/simple-push" \
                -H 'Content-Type: application/json' \
                -d "$(jq -nc --arg t "$title" --arg b "$body" --arg s "$WXPUSHER_SPT" \
                      '{spt:$s,summary:$t,content:($t+"\n\n"+$b),contentType:1}')" >/dev/null || true
            fi
          }

          AD_LIST=$(oci iam availability-domain list --compartment-id "$OCI_TENANCY" \
            --query 'data[*].name' --raw-output | jq -r '.[]' | sort)
          echo "[AD] hedef availability-domain: $(echo $AD_LIST | tr '\n' ' ')"
          echo "**Availability-domain**: $(echo $AD_LIST | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

          IMAGE_ID=$(oci compute image list --compartment-id "$OCI_TENANCY" \
            --operating-system "Canonical Ubuntu" --operating-system-version "24.04" \
            --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED --sort-order DESC \
            --query 'data[0].id' --raw-output)
          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" = "null" ]; then
            echo "::error::Ubuntu 24.04 ARM görsel ID alınamadı"
            notify "❌ OCI sniper: görsel sorgusu başarısız" "VM.Standard.A1.Flex için Ubuntu 24.04 görseli bulunamadı, REGION değerini kontrol et."
            exit 1
          fi
          echo "[IMG] $IMAGE_ID"

          # ── Spec adayları: önce girdiyi doğrula, sonra OCPU sayısına göre kademeli düşür ──
          #    Eski yol JSON'u boşlukla ayrılmış bir string'e katıyordu + case ile "ocpus":4
          #    eşleştiriyordu; shape_config içine bir boşluk yazmak ikisini de kırıyordu.
          if ! echo "$SHAPE_CONFIG" | jq -e . >/dev/null 2>&1; then
            echo "::error::shape_config geçerli bir JSON değil: $SHAPE_CONFIG"
            notify "❌ OCI sniper: geçersiz spec" "\`shape_config\` geçerli bir JSON değil: \`$SHAPE_CONFIG\`"
            exit 1
          fi
          if ! WANTED_OCPUS=$(echo "$SHAPE_CONFIG" | jq -er '.ocpus | numbers' 2>/dev/null); then
            echo "::error::shape_config içinde sayısal .ocpus alanı yok: $SHAPE_CONFIG"
            notify "❌ OCI sniper: geçersiz spec" "\`shape_config\` içinde sayısal \`.ocpus\` alanı yok: \`$SHAPE_CONFIG\`"
            exit 1
          fi

          # Always Free toplam 4 OCPU / 24 GB, 1C:6G oranında kademeli olarak en küçüğe iner
          mapfile -t CFGS < <(jq -nc \
            --argjson want "$WANTED_OCPUS" --argjson want_cfg "$SHAPE_CONFIG" \
            '([$want_cfg] + ([{"ocpus":4,"memoryInGBs":24},{"ocpus":3,"memoryInGBs":18},{"ocpus":2,"memoryInGBs":12},{"ocpus":1,"memoryInGBs":6}] | map(select(.ocpus < $want)))) | .[]')
          echo "[CFG] deneme sırası: ${CFGS[*]}"

          START=$(date +%s)
          LIMIT=$(( DURATION_MIN * 60 ))
          ROUND=0

          while true; do
            NOW=$(date +%s); ELAPSED=$(( NOW - START ))
            if [ "$ELAPSED" -gt "$LIMIT" ]; then
              echo "[TIMEOUT] ${DURATION_MIN} dakika doldu, güvenli çıkış."
              echo "⏱ Bu turda yakalanmadı, güvenli çıkış yapıldı (${ELAPSED}s sürdü)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            ROUND=$(( ROUND + 1 ))
            for cfg in "${CFGS[@]}"; do
              for ad in $AD_LIST; do
                echo "[R${ROUND}][TRY] $ad | $cfg | ${ELAPSED}s"
                OUT=$(oci compute instance launch \
                  --availability-domain "$ad" \
                  --compartment-id "$OCI_TENANCY" \
                  --shape "VM.Standard.A1.Flex" \
                  --shape-config "$cfg" \
                  --image-id "$IMAGE_ID" \
                  --subnet-id "$SUBNET_ID" \
                  --ssh-authorized-keys-file ~/.ssh/oracle_arm.pub \
                  --user-data-file ~/.ssh/cloud-init.yaml \
                  --assign-public-ip true \
                  --boot-volume-size-in-gbs "$BOOT_GB" \
                  --display-name "SNIPER-$(date +%m%d_%H%M)" 2>&1) && RC=0 || RC=$?
                if [ "$RC" -eq 0 ]; then
                  IID=$(echo "$OUT" | jq -r '.data.id')
                  # Makine oluşturuldu ama VNIC / public IP asenkron bağlanıyor, görünmesini bekle
                  IP=""
                  for _ in $(seq 1 30); do
                    IP=$(oci compute instance list-vnics --instance-id "$IID" \
                          --query 'data[0]."public-ip"' --raw-output 2>/dev/null)
                    if [ -n "$IP" ] && [ "$IP" != "null" ]; then break; fi
                    IP=""
                    sleep 2
                  done
                  echo "=============================================="
                  echo "[SUCCESS] Yakalandı!"
                  echo "Makine OCID : $IID"
                  echo "Public IP   : $IP"
                  echo "Domain      : $ad"
                  echo "Spec        : $cfg"
                  echo "=============================================="
                  {
                    echo "## 🎉 OCI ARM makinesi yakalandı"
                    echo ""
                    echo "| Alan | Değer |"
                    echo "|---|---|"
                    echo "| Makine OCID | \`$IID\` |"
                    echo "| Public IP | \`$IP\` |"
                    echo "| Availability-domain | \`$ad\` |"
                    echo "| Spec | \`$cfg\` |"
                    echo "| Boot volume | ${BOOT_GB} GB |"
                    echo "| Kullanıcı | \`ubuntu\` |"
                    echo "| Keepalive | cloud-init ile otomatik kuruldu ve başlatıldı |"
                    echo ""
                    echo "SSH: \`ssh -i <özel-anahtarın> ubuntu@$IP\`"
                  } >> "$GITHUB_STEP_SUMMARY"
                  notify "🎉 OCI ARM makinesi yakalandı!" "**Makine OCID**:\`$IID\`  \n\n**Public IP**:\`$IP\`  \n\n**Availability-domain**:\`$ad\`  \n\n**Spec**:\`$cfg\`  \n\n**Boot volume**: ${BOOT_GB} GB  \n\nKeepalive ve ağ heartbeat'i cloud-init ile kuruldu, giriş yapınca hazır.  \n\nSSH: \`ssh -i <özel-anahtarın> ubuntu@$IP\`"
                  echo "$IID" > instance-ocid.txt
                  exit 0
                fi
                if echo "$OUT" | grep -qiE 'quota|LimitExceeded|not eligible|CannotParseRequest'; then
                  echo "  ↳ Kota yetersiz veya uygun değil, bu spec atlanıyor: $cfg"
                  continue 2
                fi
                if echo "$OUT" | grep -qiE 'Out of host capacity|OutOfHostCapacity|capacity'; then
                  echo "  ↳ $ad stokta yok"
                else
                  echo "  ↳ Diğer hata: $(echo "$OUT" | tail -3 | tr '\n' ' ' | cut -c1-240)"
                fi
                sleep 3
              done
            done
            sleep 30
          done

      - name: Makine bilgisini kaydet
        if: ${{ hashFiles('instance-ocid.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: instance-ocid
          path: instance-ocid.txt
          retention-days: 90