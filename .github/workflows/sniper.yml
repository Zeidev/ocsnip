name: Oracle ARM Sniper

# ─────────────────────────────────────────────────────────────
# 跑在公开仓库：Actions 分钟数不计费，可 7×24 不间断
# 每 5 小时触发一次，单次最长跑 290 分钟（GitHub 单 job 上限 6h）
# 上一轮没结束时新的一轮会排队，不会互相踩
#
# 抢到后不只是开机 —— 通过 cloud-init 一次性把「保活 + 探针 + 环境」
# 全部装好，实例出生即是完成态，规避官方 7 天闲置回收规则。
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      test_notify:
        description: '只测微信推送，不抢机（填 1 测，填 0 正常抢）'
        required: false
        default: '0'
      shape_config:
        description: 'Shape 配置 JSON'
        required: false
        default: '{"ocpus":2,"memoryInGBs":12}'
      boot_volume_gb:
        description: '引导卷 GB（Always Free 总块存储 200GB）'
        required: false
        default: '100'
      duration_min:
        description: '单次运行上限（分钟）'
        required: false
        default: '290'
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: oci-arm-sniper
  cancel-in-progress: false

jobs:
  sniper:
    name: ARM Instance Sniper
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OCI_TENANCY: ${{ secrets.TENANCY_OCID }}
      OCI_USER: ${{ secrets.USER_OCID }}
      OCI_FP: ${{ secrets.FINGERPRINT }}
      OCI_REGION: ${{ secrets.REGION }}
      OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      SUBNET_ID: ${{ secrets.SUBNET_ID }}
      SSH_PUB_KEY: ${{ secrets.SSH_PUB_KEY }}
      # ── 推送通道：三个都是可选的，配哪个就走哪个，全配就全推 ──
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}   # Server酱（免费版 5 条/天）
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # Telegram Bot（免费无限）
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}             # 企业微信群机器人（免费无限）
      WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}               # WxPusher 极简推送（免费无限，进微信）

    steps:
      - name: Preflight 检查 Secrets
        run: |
          set -u
          missing=""
          for v in OCI_TENANCY OCI_USER OCI_FP OCI_REGION OCI_PRIVATE_KEY SUBNET_ID SSH_PUB_KEY; do
            eval "val=\${$v:-}"
            [ -z "$val" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少 Secrets:$missing"
            echo "### ❌ 缺少 Secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Secrets 齐全" >> "$GITHUB_STEP_SUMMARY"
          [ -z "${SERVERCHAN_SENDKEY:-}" ] && echo "⚠️ 未配置 SERVERCHAN_SENDKEY，抢到后不会推微信" >> "$GITHUB_STEP_SUMMARY" || true

      - name: 推送自检
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notify == '1' }}
        run: |
          set -u
          ok=0
          if [ -n "${SERVERCHAN_SENDKEY:-}" ]; then
            curl -s -m 20 -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
              --data-urlencode "title=✅ 甲骨文抢机 · Server酱通道已打通" \
              --data-urlencode "desp=这是一条自检消息。" && ok=1
          fi
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -s -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=✅ 甲骨文抢机 · Telegram 通道已打通" && ok=1
          fi
          if [ -n "${WECOM_WEBHOOK:-}" ]; then
            jq -n '{msgtype:"text",text:{content:"✅ 甲骨文抢机 · 企业微信通道已打通"}}' \
              | curl -s -m 20 -X POST "$WECOM_WEBHOOK" -H 'Content-Type: application/json' -d @- && ok=1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "::error::三个推送通道都没配，请至少配一个"
            exit 1
          fi
          echo "自检消息已发送，请查看手机。" >> "$GITHUB_STEP_SUMMARY"

      - name: 安装 OCI CLI
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify == '1') }}
        run: |
          curl -sL -o install.sh https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          chmod +x install.sh
          ./install.sh --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null

      - name: 写入 OCI 配置并鉴权
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify == '1') }}
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FP}
          tenancy=${OCI_TENANCY}
          region=${OCI_REGION}
          key_file=/home/runner/.oci/key.pem
          EOF
          printf '%s\n' "${OCI_PRIVATE_KEY}" > ~/.oci/key.pem
          chmod 700 ~/.oci
          chmod 600 ~/.oci/key.pem ~/.oci/config
          ~/bin/oci iam region list --query 'data[0].name' --raw-output && echo "✅ OCI 鉴权通过"

      - name: 取回 cloud-init（实例出生即完成态）
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify == '1') }}
        run: |
          mkdir -p ~/.ssh
          curl -sL -o ~/.ssh/cloud-init.yaml \
            https://raw.githubusercontent.com/chengchengbeigu-source/ocisniper/main/.github/cloud-init.yaml
          head -1 ~/.ssh/cloud-init.yaml | grep -q '^#cloud-config' \
            || { echo "::error::cloud-init 下载失败"; exit 1; }
          printf '%s\n' "${SSH_PUB_KEY}" > ~/.ssh/oracle_arm.pub
          chmod 600 ~/.ssh/oracle_arm.pub ~/.ssh/cloud-init.yaml
          echo "cloud-init 已就绪，$(wc -l < ~/.ssh/cloud-init.yaml) 行"

      - name: 抢机主循环
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify == '1') }}
        env:
          SHAPE_CONFIG: ${{ inputs.shape_config || '{"ocpus":2,"memoryInGBs":12}' }}
          BOOT_GB: ${{ inputs.boot_volume_gb || '100' }}
          DURATION_MIN: ${{ inputs.duration_min || '290' }}
        run: |
          set -u
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          export PATH="$HOME/bin:$PATH"

          notify() {
            local title="$1" body="$2"
            # 通道 1：Server酱 → 个人微信（免费版 5 条/天）
            if [ -n "${SERVERCHAN_SENDKEY:-}" ]; then
              curl -s -m 20 -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
                --data-urlencode "title=$title" --data-urlencode "desp=$body" >/dev/null || true
            fi
            # 通道 2：Telegram Bot（免费无限量）
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              TG_TEXT=$(printf '%s\n%s' "$title" "$body")
              curl -s -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${TG_TEXT}" >/dev/null || true
            fi
            # 通道 3：企业微信群机器人（免费无限量）
            if [ -n "${WECOM_WEBHOOK:-}" ]; then
              jq -n --arg t "$title" --arg b "$body" \
                '{msgtype:"text",text:{content:($t+"\n"+$b)}}' \
                | curl -s -m 20 -X POST "$WECOM_WEBHOOK" \
                    -H 'Content-Type: application/json' -d @- >/dev/null || true
            fi
            # 通道 4：WxPusher 极简推送 SPT（免费无限，微信 ClawBot 直达）
            if [ -n "${WXPUSHER_SPT:-}" ]; then
              curl -s -m 20 -X POST "https://wxpusher.zjiecode.com/api/send/message" \
                -H 'Content-Type: application/json' \
                -d "$(jq -nc --arg t "$title" --arg b "$body" --arg s "$WXPUSHER_SPT" \
                      '{appToken:$s,content:($t+"\n\n"+$b),contentType:1}')" >/dev/null || true
            fi
          }

          AD_LIST=$(oci iam availability-domain list --compartment-id "$OCI_TENANCY" \
            --query 'data[*].name' --raw-output | jq -r '.[]' | sort)
          echo "[AD] 目标可用区: $(echo $AD_LIST | tr '\n' ' ')"
          echo "**可用区**：$(echo $AD_LIST | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

          IMAGE_ID=$(oci compute image list --compartment-id "$OCI_TENANCY" \
            --operating-system "Canonical Ubuntu" --operating-system-version "24.04" \
            --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED --sort-order DESC \
            --query 'data[0].id' --raw-output)
          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" = "null" ]; then
            echo "::error::拿不到 Ubuntu 24.04 ARM 镜像 ID"
            notify "❌ 甲骨文抢机：镜像查询失败" "拿不到 VM.Standard.A1.Flex 的 Ubuntu 24.04 镜像，请检查 REGION 是否正确。"
            exit 1
          fi
          echo "[IMG] $IMAGE_ID"

          CANDIDATES="$SHAPE_CONFIG"
          case "$SHAPE_CONFIG" in
            *'"ocpus":4'*) CANDIDATES="$SHAPE_CONFIG '{"ocpus":2,"memoryInGBs":12}' '{"ocpus":1,"memoryInGBs":6}'" ;;
            *'"ocpus":2'*) CANDIDATES="$SHAPE_CONFIG '{"ocpus":1,"memoryInGBs":6}'" ;;
          esac
          echo "[CFG] 尝试顺序: $CANDIDATES"

          START=$(date +%s)
          LIMIT=$(( DURATION_MIN * 60 ))
          ROUND=0

          while true; do
            NOW=$(date +%s); ELAPSED=$(( NOW - START ))
            if [ "$ELAPSED" -gt "$LIMIT" ]; then
              echo "[TIMEOUT] 已跑满 ${DURATION_MIN} 分钟，安全退出。"
              echo "⏱ 本轮未抢到，已安全退出（已跑 ${ELAPSED}s）。" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            ROUND=$(( ROUND + 1 ))
            for cfg in $CANDIDATES; do
              for ad in $AD_LIST; do
                echo "[R${ROUND}][TRY] $ad | $cfg | ${ELAPSED}s"
                OUT=$(oci compute instance launch \
                  --availability-domain "$ad" \
                  --compartment-id "$OCI_TENANCY" \
                  --shape "VM.Standard.A1.Flex" \
                  --shape-config "$cfg" \
                  --image-id "$IMAGE_ID" \
                  --subnet-id "$SUBNET_ID" \
                  --ssh-authorized-keys-file ~/.ssh/oracle_arm.pub \
                  --user-data-file ~/.ssh/cloud-init.yaml \
                  --assign-public-ip true \
                  --boot-volume-size-in-gbs "$BOOT_GB" \
                  --display-name "SNIPER-$(date +%m%d_%H%M)" \
                  --wait-for-state RUNNING --max-wait-seconds 1 2>&1) && RC=0 || RC=$?
                if [ "$RC" -eq 0 ]; then
                  IID=$(echo "$OUT" | jq -r '.data.id')
                  IP=$(oci compute instance list-vnics --instance-id "$IID" \
                        --query 'data[0]."public-ip"' --raw-output 2>/dev/null)
                  echo "=============================================="
                  echo "[SUCCESS] 抢到了！"
                  echo "实例 OCID : $IID"
                  echo "公网 IP   : $IP"
                  echo "可用区    : $ad"
                  echo "规格      : $cfg"
                  echo "=============================================="
                  {
                    echo "## 🎉 抢到甲骨文 ARM 实例"
                    echo ""
                    echo "| 项 | 值 |"
                    echo "|---|---|"
                    echo "| 实例 OCID | \`$IID\` |"
                    echo "| 公网 IP | \`$IP\` |"
                    echo "| 可用区 | \`$ad\` |"
                    echo "| 规格 | \`$cfg\` |"
                    echo "| 引导卷 | ${BOOT_GB} GB |"
                    echo "| 登录用户 | \`ubuntu\` |"
                    echo "| 保活 | cloud-init 已自动装上并启动 |"
                    echo ""
                    echo "SSH：\`ssh -i <你的私钥> ubuntu@$IP\`"
                  } >> "$GITHUB_STEP_SUMMARY"
                  notify "🎉 甲骨文 ARM 抢机成功！" "**实例 OCID**：\`$IID\`  \n\n**公网 IP**：\`$IP\`  \n\n**可用区**：\`$ad\`  \n\n**规格**：\`$cfg\`  \n\n**引导卷**：${BOOT_GB} GB  \n\n保活与网络心跳已由 cloud-init 自动装好，登录即可用。  \n\n登录：\`ssh -i <私钥> ubuntu@$IP\`"
                  echo "$IID" > instance-ocid.txt
                  exit 0
                fi
                if echo "$OUT" | grep -qiE 'quota|LimitExceeded|not eligible|CannotParseRequest'; then
                  echo "  ↳ 配额不足/不可用，跳过该配置：$cfg"
                  continue 2
                fi
                if echo "$OUT" | grep -qiE 'Out of host capacity|OutOfHostCapacity|capacity'; then
                  echo "  ↳ $ad 无库存"
                else
                  echo "  ↳ 其他错误：$(echo "$OUT" | tail -3 | tr '\n' ' ' | cut -c1-240)"
                fi
                sleep 3
              done
            done
            sleep 30
          done

      - name: 保存实例信息
        if: ${{ hashFiles('instance-ocid.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: instance-ocid
          path: instance-ocid.txt
          retention-days: 90
