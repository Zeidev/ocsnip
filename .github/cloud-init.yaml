#cloud-config
# ─────────────────────────────────────────────────────────────
# ocisniper makine başlangıç betiği (makine doğuştan tamamlanmış gelir)
# Amaç: resmî "7 gün boşta kalınca geri alınır" kuralını aşmak, ortamı tek seferde kurmak
#   CPU 95. persentil  ≥ %20 → oci-keepalive (stress-ng sürekli %65 yük)
#   RAM 95. persentil ≥ %20 → oci-keepalive aynı anda %40 bellek tutuyor
#   Ağ  95. persentil ≥ %20 → oci-netbeat (saatte 25 MB indirme)
# Bunlardan biri düşük kalırsa makine "boşta" sayılır ve geri alınır.
# ─────────────────────────────────────────────────────────────
package_update: true
package_upgrade: false
packages:
  - stress-ng
  - jq
  - curl
  - htop
  - net-tools

swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

write_files:
  - path: /usr/local/bin/oci-keepalive.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # CPU + bellek çift metrikli sürekli yük, resmî geri-alma kuralına karşı
      exec stress-ng --cpu 1 --cpu-load 65 --vm 1 --vm-bytes 40% --vm-keep --timeout 0

  - path: /etc/systemd/system/oci-keepalive.service
    permissions: '0644'
    content: |
      [Unit]
      Description=OCI Always Free anti-reclaim keepalive
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/local/bin/oci-keepalive.sh
      Restart=always
      RestartSec=5
      Nice=10
      CPUSchedulingPolicy=batch

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/oci-netbeat.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Saatte 25 MB indirir, ağ 95. persentilini yukarı kaldırır (ağ için çift güvence)
      while true; do
        curl -s -m 120 -o /dev/null https://speed.cloudflare.com/__down?bytes=25000000 || true
        sleep 3600
      done

  - path: /etc/systemd/system/oci-netbeat.service
    permissions: '0644'
    content: |
      [Unit]
      Description=OCI anti-reclaim network heartbeat
      After=network-online.target

      [Service]
      ExecStart=/usr/local/bin/oci-netbeat.sh
      Restart=always
      RestartSec=10
      Nice=15

      [Install]
      WantedBy=multi-user.target

  - path: /etc/motd
    permissions: '0644'
    content: |
      ==================================================
        Bu makine ocisniper tarafından otomatik yakalandı ve kuruldu
          · keepalive servisi:  systemctl status oci-keepalive
          · ağ heartbeat servisi: systemctl status oci-netbeat
          · Yukarıdaki iki servisi durdurma, yoksa 7 gün içinde geri alınır
      ==================================================

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now oci-keepalive.service
  - systemctl enable --now oci-netbeat.service
  - echo "ocisniper cloud-init tamamlandi: $(date -Is)" > /var/log/ocisniper-init.log

final_message: "ocisniper: makine kurulumu tamamlandı (keepalive başlatıldı)"